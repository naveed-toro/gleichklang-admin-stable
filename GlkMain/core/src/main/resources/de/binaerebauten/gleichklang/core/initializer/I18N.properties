SYSTEM_SESSION_EXPIRED_MESSAGE=Sie wurden aus Sicherheitsgründen abgemeldet, weil Sie eingeloggt waren und längere Zeit keine Aktivität gezeigt haben. Bitte loggen Sie sich erneut ein.
SYSTEM_SESSION_EXPIRED_CAPTION=Session abgelaufen
SYSTEM_COMMUNICATION_ERROR_MESSAGE=Die Verbindung zwischen Ihrem Rechner und unserem Server ist fehlerhaft. Bitte versuchen Sie es noch einmal. Sollte das Problem wiederholt auftreten, nehmen Sie bitte mit uns Kontakt auf, damit wir das Problem lösen können.
SYSTEM_COMMUNICATION_ERROR_CAPTION=Kommunikationsfehler
SYSTEM_INTERNAL_ERROR_MESSAGE=Entschuldigung, wir haben hier ein Problem! Wir arbeiten bereits an einer Lösung. Bitte versuchen Sie es später wieder. Sollte das Problem über einen längeren Zeitraum wiederholt auftreten, nehmen Sie bitte mit uns Kontakt auf.
SYSTEM_INTERNAL_ERROR_CAPTION=Interner Fehler
SYSTEM_OUT_OF_SYNC_MESSAGE=Sie haben mehrere Fenster mit den gleichen Inhalten der Gleichklang-Anwendung geöffnet. Bitte schließen Sie diese und versuchen Sie es erneut. Sollte das Problem wiederholt auftreten, nehmen Sie bitte mit uns Kontakt auf, damit wir das Problem lösen können.
SYSTEM_OUT_OF_SYNC_CAPTION=Synchronisationsfehler
SYSTEM_DISABLED_COOKIE_MESSAGE=Die Anwendung benötigt Cookies um korrekt zu funktionieren. Diese sind bei Ihnen deaktiviert. Bitte ändern Sie Ihre Browser-Einstellungen oder verwenden Sie einen anderen Browser.
SYSTEM_DISABLED_COOKIE_CAPTION=Deaktivierte Cookies
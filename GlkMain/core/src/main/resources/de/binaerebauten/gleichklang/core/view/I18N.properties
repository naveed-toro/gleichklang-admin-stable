MAIL_TO_ADMIN_SUBJECT=Mitglied wünscht eine Beratung
MAIL_TO_ADMIN_TEXT1 = Das Mitglied
MAIL_TO_ADMIN_TEXT2 = wunscht eine Beratung(Verlangerung ausschalten?)
MESAAGE_TO_ADMIN_UI=Ein Mitglied unseres Teams wird sich schnellstmöglich mit Ihnen in Verbindung setzen!
DEACTIVATE_PROLONGATION_PAGE2_BUTTON3_NEXT_DESCRIPTIONS1=Wenn die Partnersuche bereits erfolgreich war, können Sie Gleichklang weiterhin für die Freundschaftssuche und die Reisepartnersuche nutzen.

DEACTIVATE_PROLONGATION_PAGE2_BUTTON3_NEXT_DESCRIPTIONS2=Außerdem könnte übrigens ein erneuter Einsteig teurer werden als die derzeitige Verlängerung.
DEACTIVATE_PROLONGATION_PAGE3_BUTTON1_CAPTION=Ich warte lieber noch etwas ab.
DEACTIVATE_PROLONGATION_PAGE3_BUTTON2_CAPTION=Ich will die Verlängerung ausstellen.
DEACTIVATE_PROLONGATION_PAGE3_CAPTION_DESCRIPTION=Wenn Sie jetzt das Ausstellen der Verlängerung bestätigen, verlieren Sie mit dem Datum des Endes des gebuchten Teilnahmezeitraums den Zugang zu Ihrem Account. Bei einem erneuten Einstieg würden erneut Kosten und womöglich höhere Kosten anfallen.

DEACTIVATE_PROLONGATION_PAGE1_CAPTION_DESCRIPTION="Ich habe meinen Partner gefunden, weil ich vergessen hatte, die Verlängerung auszustellen. Wir sind sehr glücklich miteinander."

DEACTIVATE_PROLONGATION_PAGE1_BUTTON1_CAPTION=Ok, ich versuche es weiter!

DEACTIVATE_PROLONGATION_PAGE1_BUTTON1_NEXT_DESCRIPTION=Gratulation, dies freut uns sehr. Bitte melden Sie sich jederzeit beim Team, wenn wir Ihnen helfen können.

DEACTIVATE_PROLONGATION_PAGE1_BUTTON2_CAPTION=Ich möchte mich doch erst einmal\ndurch das Team beraten lassen.


DEACTIVATE_PROLONGATION_PAGE2_BUTTON1_CAPTION=Ok, ich versuche es weiter!

DEACTIVATE_PROLONGATION_PAGE1_BUTTON3_CAPTION=Ich will die Verlängerung ausstellen.

DEACTIVATE_PROLONGATION_PAGE2_BUTTON2_CAPTION=Ich will die Verlängerung ausstellen.

DEACTIVATE_PROLONGATION_PAGE2_BUTTON3_NEXT_DESCRIPTION=Beziehungssuche ist ein Prozess, der durchaus längere Zeit dauern kann, auch einige Jahre. Dafür soll die Beziehung bis zum Lebensende halten. Bei Gleichklang bleibt nach unseren Auswertungen die große Mehrheit der Beziehungen dauerhaft erhalten und glücklich.

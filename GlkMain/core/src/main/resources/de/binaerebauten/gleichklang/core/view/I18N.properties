LOGINVIEW_CAPTION_ADDITIONALTEXT=\
  <b>Schon registriert?</b> Hier einloggen und Teilnahme starten!\n\
  <b>Bereits Mitglied?</b> Hier einloggen und in den Teilnehmerbereich!\n\
  <br>\
  <b>Hinweis zur Bearbeitung:</b>\n\
  <br>\
  Falls Sie noch nicht Mitglied sind, kann es sein, dass Sie noch einmal durch die Frageb\u00F6gen geleitet werden, \
  um unvollst\u00E4ndige Fragen auszuf\u00FCllen. Dies soll sicherstellen, dass die Vermittlung f\u00FCr Sie dann auch optimal funktioniert. \
  Sie k\u00F6nnen einfach durch den Fragebogen nach unten scrollen und auf "weiter" klicken. Falls eine Antwort fehlt, \
  wird sie rot umrandet angezeigt und kann so ausgef\u00FCllt werden.\n\
  <br>\
  Login-Probleme? Bitte wenden Sie sich an das Team - wir l\u00F6sen das Problem: <a target="_blank" href="https://www.gleichklang.de/kontakt/">Kontaktformular</a>
REGISTRATIONVIEW_REGISTRATION_SUCCESS=Willkommen bei Gleichklang! Bitte geben Sie jetzt noch einmal Ihr Passwort ein und f\u00FCllen Sie danach die Frageb\u00F6gen aus, damit Ihre Teilnahme auch starten kann. Haben Sie etwas Geduld, es kann ein paar Sekunden dauern bis es weitergeht. Au\u00DFerdem haben wir Ihnen gerade einen Link f\u00FCr die Freischaltung ihrer E-Mail Adresse zugesandt. Bitte klicken Sie jetzt in der erhaltenen Email auf den Link, damit Sie wichtige System-Emails f\u00FCr Ihre Teilnahme erhalten und auch die Passwort-Vergessen-Funktion nutzen k\u00F6nnen. Loggen Sie sich jetzt ein und starten Sie durch!


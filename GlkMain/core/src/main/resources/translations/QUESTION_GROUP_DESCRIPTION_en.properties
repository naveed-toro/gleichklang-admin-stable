fieldset.groessenbereich=The body height does not take into account mental attributes. Strongly varying heights do not influence a satisfying relationship. Only specify a height preference if it is important for you.<br/>There are more options to limit the height of the person you are searching for.<br/><br/>The following should explain how to adjust the corresponding size so that your search can be more successful:<br/><br/>The [ <b>Minimum Height(cm)</b> specifies the minimum height of the person you are searching for.<br/>The <b>Preferred height(cm)</b> specifices the preferred height of the person you are searching for.<br/>The <b>Maximum height(cm)</b> specifies the maximum height of the person you are searching for.<br/><br/>All three terms can be chosen in any combination. All three terms must be filled out to search. The following examples will show how this works:<br/><b>Example 1:</b><br/>Minimum height: none (=0)<br/>Preferred height: none (=0)<br/>Maximum height: none (=0)<br/>Result: Height will not be taken in to account during the search for matches.<br/><br/><b>Example 2</b><br/>Minimum height: 165 cm<br/>Preferred height: 175 cm<br/>Maximum height: 180 cm<br/>Result: The best matches will be of the preferred height. The farther one is from the preferred height, the more unlikely a match they are. It is possible, although unlikely, that a match will be suggested, who is 2-3 cm under or over the height limit because the limits are somewhat flexible.<br/><br/><b>Example 3</b><br/>Minimum height: 165 cm<br/>Preferred height: none<br/>Maximum height: 180 cm<br/>Result: Only people between 165 cm and 180 cm will be recommended. No one less than 165 cm or more than 180 cm will be recommended<br/><br/><b>Example 4</b><br/>Minimum height: none (=0)<br/>Preferred height: 175 cm<br/>Maximum height: none (=0)<br/>Result: Matches that are 175 cm tall will have the highest probably of being suggested. It is possible that people who aren't 175 cm tall will be suggested as long as they meet the other search criteria. (You can also adjust the height limit to increase the number of matches you receive).<br/><br/><br/>We recommend giving a preferred height (if it is important to your search) and adjusting the limits accordingly. The more limited your height criteria is, the fewer matches you will receive.

fieldset.altersbereich=There are more options to limit the age group of the person you are searching for. The following should explain how to adjust the corresponding size so that your search can be more successful.<br/><br/>The <b>Minimum Age</b> specifies the minimum age of the person you are searching for.<br/>The [ <b>Preferred age</b> specifices the preferred age of the person you are searching for.<br/>The [ <b>Maximum age</b> specifies the maximum age of the person you are searching for.<br/><br/>All three terms can be chosen in any combination. All three terms must be filled out to search. The following examples will show how this works: <br/>The <b>Preferred age</b> specifices the preferred age of the person you are searching for.<br/>The [ <b>Maximum age</b> specifies the maximum age of the person you are searching for./nAll three terms can be chosen in any combination. All three terms must be filled out to search. The following examples will show how this works:<br/>The <b>Preferred age</b> specifies the preferred age of the person you are searching for.[ <b>Maximum age</b> specifies the maximum age of the person you are searching for.<br/><br/> All three terms can be chosen in any combination. All three terms must be filled out to search. The following examples will show how this works:<br/><br/><b>Example 1:</b><b>Minimum age</b> none (=0) <b>Preferred age</b> none (=0)<b>Maximum age</b> none (=0)<br/>Result: Age will not be factored in to the search for your matches.<br/><br/><b>Example 2:</b><br/>Minimum age: 30<br/>Preferred age: 40<br/>Maximum age:45<br/>Result: The matches are grouped according to the preferred age of 40. The farther someone is from that age, the more unlikely it will be for that person to appear as a match. It is possible, albeit unlikely, for someone who is 1-2 years younger than the minimal age preference to appear in the match group. The age limits are somewhat flexible during the search.<br/><br/>[ <b>Example 3:</b><br/> Minimum age: 30<br/>Preferred Age: none (=0)<br/>Maximum age: 45<br/> Result: Only people between the ages of 30 and 45 have been recommended, but they all have the same probability.<br/><br/><b>Example 4:</b><br/>Minimum age: none (=0)<br/>Preferred age: 40<br/>Maximum age: none (=0)<br/>Result: There is a high probably of all matches being 40 years old. However, it is possible that some of the matches will not be 40, as long as they meet many of the other search criteria. (You can also open the search to those under or over 40 years old to see more possible matches).<br/><br/>Our recommendation is to give a preferred age and then adjust the limits accordingly. The more specific you make your age limit, the fewer matches you will receive.
text.instruktion_person= Give more details about yourself and your living environment. These details will be shown to your suggested matches.
text.instruktion_aussehen= Describe your appearance. Your entry will be shown to your suggested matches.
text.instruktion_partner= Describe your ideal partner, including physical aspects, as well as geographical location and age limits if it is important to you. Be sure to include diets and other customs or habits. \n\nIt is recommended to not limit your criteria. The less limited your search, the higher your chances of success will be. However, if certain limitations are especially important to you, be sure to include them.

text.instruktion_freund= Describe your ideal friend, including physical aspects, as well as geographical location and age limits if it is important to you. Be sure to include diets and other customs or habits. \n\nIt is recommended to not limit your criteria. The less limited your search, the higher your chances of success will be. However, if certain limitations are especially important to you, be sure to include them.


text.instruktion_hobby_e= Describe your overall interests. Upon answering the questions, you will be asked to rank your interests on a scale of 1-5. Please mark:\n\n1 Do not approve: if you do not approve at all. \n2 Generally do not approve: if you generally disapprove. \n3 Undecided: if you are undecided. \n4 Approve: if you approve. \n5 Strongly approve: if you emphatically approve. \n\n${instruktion_tastatur_skala_eingabe}

text.instruktion_hobby_v= Describe your hobbies now. Only include hobbies that are really important in your life! Your details will be shown to your suggested matches.
text.instruktion_persoenlichkeit= In the following section you will find a variety of statements relating to your experiences and attitudes. Please read each statement carefully and check off the answer that comes closest to your view. Please answer the questions spontaneously and without too much contemplation. The first spontaneous answer is typically the best one. It is important to choose the closest possible answer even if you find it difficult to make a decision. Please answer all the statements or we will not be able to analyze this section. Please answer honestly. Please mark: \n\n(1) Strongly disapprove: if you do not approve at all. \n(2) Disapprove: when you rarely approve. \n(3) Neutral: if you neither approve nor disapprove. \n(4) Approve: when you usually approve. \n(5) Strongly approve: if you emphatically approve.
text.instruktion_adjektive= In the following section you will be giving two words with opposite meanings. You must decide, which of the words applies to you. If for example the word on the left applies to you, check off the 2 on the left side. Conversely, if the word on the right applies to you, check off the 2 on the right side. If the word on the left partially applies to you, check off the 1 on the left side. If the word on the right partially applies to you, check off the 1 on the right side. Check off the 0 if you cannot decide which word applies to you. \n\n${instruktion_tastatur_skala_eingabe}
text.instruktion_partnerschaft= Please describe what is important to you in a relationship. Your answers will be on a scale from 1-5. Please mark: \n\n(1) Disapprove: if you completely disapprove. \n(2) Partially disapprove: if you usually disapprove. \n(3) Undecided: if you are undecided. \n(4) Approve: if you approve. \n(5) Strongly approve: if you emphatically approve.  \n\n${instruktion_tastatur_skala_eingabe}
text.instruktion_freundschaft= Please describe what is important to you in a friendship. Your answers will be on a scale from 1-5. Please mark: \n\n(1) Disapprove: if you completely disapprove. \n(2) Partially disapprove: if you usually disapprove. \n(3) Undecided: if you are undecided. \n(4) Approve: if you approve. \n(5) Strongly approve: if you emphatically approve.  \n\n${instruktion_tastatur_skala_eingabe}

text.instruktion_gesellschaft=People have differing views on general societal topics.\n\nPlease give your opinion on the following societal topics. There is no right or wrong answer, it all depends on your personal preferences. You can rate your answers on a scale of 1-5. Please mark: \n\n(1)Disagree: if you completely disagree. \n(2) Partially disagree: if you usually disagree. \n(3) Undecided: if you are undecided. \n(4) Partially agree: if you agree. \n(5) Agree: if you emphatically agree. \n\n${instruktion_tastatur_skala_eingabe}
text.instruktion_kritische_lebensereignisse=Everyone has more or less critical and/or incriminating events in their life. Some of these type of events are listed in the following section. Please confirm if you have experienced any of these events and if so, when you experienced them and how meaningful these events are for you today: \n\n(1) Not experienced\n(2) experienced, but not meaningful\n(3) experienced, but not very meaningful\n(4) experienced and meaningful\n(5) experienced and very meaningful. \n\n The following is important: always mention how important an event is to your life today. For example, if a separation from long ago is no longer important to your life today, mark: experienced, but not meaningful. What is measured is the meaning of your experience today and not how meaningful an experience was in the past. \n\n${instruktion_tastatur_skala_eingabe}
text.instruktion_ptext= Write a few sentences about yourself. You can write everything freely and/or work from three sentence beginnings formulated by us. This gives you the opportunity to give other users an impression of you outside of the framework of the questionnaire. Many users find this free space important when they are given their suggested matches. \nYou may skip the free text during registration. We recommend filling it out and reviewing it later. You may change your free text at any time.
text.instruktion_ftext= Write a few sentences about yourself. You can write everything freely and/or work from three sentence beginnings formulated by us. This gives you the opportunity to give other users an impression of you outside of the framework of the questionnaire. Many users find this free space important when they are given their suggested matches. \nYou may skip the free text during registration. We recommend filling it out and reviewing it later. You may change your free text at any time.

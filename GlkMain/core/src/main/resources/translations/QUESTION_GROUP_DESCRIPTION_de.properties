fieldset.akzeptanz=Es gibt noch einige weitere Kriterien, die wir aufgrund von Datenschutzbestimmungen nur mit vorheriger schriftlicher Einwilligung erfassen d\u00FCrfen. Wenn Sie solche Angaben f\u00FCr die Vermittlung angeben wollen (was Sie nur tun sollten, wenn es Ihnen wirklich wichtig ist, dass wir diese Informationen ber\u00FCcksichtigen), teilen Sie uns diese bitte schriftlich mit: <br/><br/>Gleichklang limited, Sallstra\u00DFe 46, 30171 Hannover, Fax: 01805-7772 3331<br/><br/>  Es handelt sich um folgende sensitiven Bereiche:<br/><br/> Religi\u00F6ses Bekenntnis, Psychische Erkrankungen, K\u00F6rperliche Erkrankungen, K\u00F6rperliche Behinderungen, Positiver HIV-Status<br/><br/> Diese Informationen sollten Sie uns aber, wie gesagt, nur dann geben, wenn es Ihnen wirklich wichtig ist, dass wir diese Informationen bei der Vermittlung ber\u00FCcksichtigen. Sie k\u00F6nnen uns diese Informationen sp\u00E4ter formlos schriftlich per Post oder Fax mitteilen mit dem zus\u00E4tzlichen Hinweis, dass Sie mit der elektronischen Speicherung dieser Daten einverstanden sind.<br/><br/> Wenn Sie uns Informationen zu psychischen Erkrankungen, schweren k\u00F6rperlichen Erkrankungen, k\u00F6rperlichen Behinderungen oder zu einem positiven HIV-Status mitteilen, werden wir Ihnen ausschlie\u00DFlich solche Personen vorschlagen, die diesbez\u00FCglich eine gewisse Akzeptanz formulierten.<br/><br/> Wenn Sie dar\u00FCber hinausgehend w\u00FCnschen, dass Ihnen ausschlie\u00DFlich solche Personen vorgeschlagen werden, die das gleiche Merkmal aufweisen, teilen Sie uns dies bitte ebenfalls mit.<br/><br/> Bitte teilen Sie uns nur dann Ihr religi\u00F6ses Bekenntnis mit, wenn Sie ausschlie\u00DFlich Personen vorgeschlagen bekommen m\u00F6chten, die das gleiche religi\u00F6se Bekenntnis teilen. Setzen Sie jetzt bitte zun\u00E4chst das Ausf\u00FCllen der Frageb\u00F6gen fort, die weiteren Informationen k\u00F6nnen Sie uns sp\u00E4ter zusenden, wenn Sie dies w\u00FCnschen.

fieldset.region_question=Mit Hilfe der regionalen Suchkriterien k\u00F6nnen Sie den geografischen Bereich einschr\u00E4nken, aus dem die Ihnen vorgeschlagenen Teilnehmer kommen sollen. Die Angabe der Kriterien erlaubt einen abgestufte Suche, wie auch eine enge, nach Bundesl\u00E4ndern oder Postleitzahlenbereichen abgegrenzte Suche. Im Folgenden soll das Prinzip verdeutlicht werden, wie man durch bestimmte Eingaben die gew\u00FCnschten Ergebnisse erzielen kann.<br/><br/>Es gibt zwei M\u00F6glichkeiten f\u00FCr die regionale Suche, die parallel angegeben werden k\u00F6nnen:<br/><br/>Die Angabe der <b>Region</b> erlaubt abgestuft die Suchbereiche<br/><i>International</i>: Alle Teilnehmer k\u00F6nnen vorgeschlagen werden<br/><i>Ganze EU</i>: Alle Teilnehmer, die aus der EU kommen k\u00F6nnen vorgeschlagen werden<br/><i>L\u00E4nder(Ganz Deutschland,Ganz \u00D6sterreich,Ganze Schweiz)</i>: Alle Teilnehmer, die aus den jeweils angegebenen L\u00E4ndern kommen, k\u00F6nnen vorgeschlagen werden<br/><i>Bundesl\u00E4nder</i> oder <i>Kantone</i>: Teilnehmer, die aus den angegebenen Bundesl\u00E4ndern oder Kantonen kommen, k\u00F6nnen vorgeschlagen werden.<br/><br/>Beachten Sie bei der Angabe der Region, dass immer alle angeklickten Eintr\u00E4ge ber\u00FCcksichtigt werden. Wenn Sie zum Beispiel <i>Ganz Deutschland</i> und <i>Niedersachsen</i> angeben, dann k\u00F6nnen Sie auch Vorschl\u00E4ge aus ganz Deutschland bekommen (diese allerdings mit kleinerer Wahrscheinlichkeit) und nicht nur Vorschl\u00E4ge aus Niedersachsen (diese allerdings mit h\u00F6herer Wahrscheinlichkeit). Wenn Sie erreichen wollen, dass Sie ausschlie\u00DFlich Vorschl\u00E4ge aus Niedersachsen bekommen, dann d\u00FCrfen Sie nur <i>Niedersachsen</i>, nicht aber die \u00FCbergeordneten Regionen <i>Ganz Deutschland</i>, <i>Ganze EU</i> oder <i>International</i> angeben, da sonst auch Vorschl\u00E4ge daher kommen.<br/><br/>Eine weitere Suchoption die parallel zu der vorher beschriebenen verwendet werden kann, ist die <b>Umkreissuche</b>. Bei der Umkreissuche ist es erlaubt, drei Suchbereiche zu spezifizieren, die aus der Postleitzahl (oder der, durch die Anfangsziffern der Postleitzahl spezifizierten Menge von Postleitzahlen), dem Land (Deutschland, \u00D6sterreich, Schweiz), zu dem die Postleitzahl geh\u00F6rt und dem Radius (in km) in dem gesucht werden soll, besteht. Ein Teilnehmer wird dann um so bevorzugter vorgeschlagen, je n\u00E4her er dem Bereich der angegeben Postleitzahl ist.<br/><b>Hinweis:Bitte beachten Sie, dass bei der Angabe der Postleitzahl oder des Bereichs nur Ziffern erlaubt sind. Alle anderen Zeichen werden ignoriert</b><br/>Die Angaben bei den Postleitzahlen werden dann beispielsweise wie folgt interpretiert:<br/><br/>Land: Deutschland<br/>PLZ: 10997<br/>Vollst\u00E4ndige Postleitzahl<br/><br/>Land: Deutschland<br/>PLZ: 10<br/>Alle Postleitzahlen, die mit 10.. anfangen.<br/><br/><br/>Beide Suchm\u00F6glichkeiten k\u00F6nnen parallel eingesetzt werden, so dass Sie in mehreren Bereichen verschieden eng oder weit suchen k\u00F6nnen. Das d\u00FCrfte aber f\u00FCr die meisten Anwendungsf\u00E4lle nicht n\u00F6tig sein.
fieldset.groessenbereich=Die K\u00F6rpergr\u00F6\u00DFe h\u00E4ngt mit psychischen Merkmalen in keiner Weise zusammen. Auch stark abweichende K\u00F6rpergr\u00F6\u00DFen beeintr\u00E4chtigen in diesem Sinne eine zufriedenstellende Partnerschaft nicht. Schr\u00E4nken Sie daher die K\u00F6rpergr\u00F6\u00DFe bei der Partnersuche also nur dann ein, wenn dies f\u00FCr Sie sehr wichtig ist.<br/> Es gibt mehrere M\u00F6glichkeiten, den Gr\u00F6\u00DFenbereich der gesuchten Personen den eigenen W\u00FCnschen gem\u00E4\u00DF einzuschr\u00E4nken. Im Folgenden soll erl\u00E4utert werden, wie die entsprechenden Gr\u00F6\u00DFen einzustellen sind, damit das gew\u00FCnschte Suchverhalten erzielt werden kann.<br/><br/>Zun\u00E4chst einmal zur Erl\u00E4uterung der drei Suchgr\u00F6\u00DFen:<br/><br/>Die <b>Mindestgr\u00F6\u00DFe(cm)</b> gibt an, wie gro\u00DF die gesuchte Person mindestens sein sollte.<br/>Die <b>bevorzugte Gr\u00F6\u00DFe (cm)</b> gibt an, welche K\u00F6rpergr\u00F6\u00DFe bei der gesuchten Person bevorzugt gew\u00FCnscht wird.<br/>Die <b>Maximalgr\u00F6\u00DFe</b> gibt an, wie gro\u00DF die gesuchte Person h\u00F6chstens sein sollte.<br/><br/>Alle drei Gr\u00F6\u00DFen k\u00F6nnen in verschiedenen Kombinationen angegeben oder weggelassen werden, was verschiedene Auswirkungen hat. Es mu\u00DF bei angegegebenen Werten allerdings folgende Bedingung erf\u00FCllt sein:<br/><b>Mindestgr\u00F6\u00DFe</b> kleiner <b>Bevorzugte Gr\u00F6\u00DFe</b> kleiner <b>Maximalgr\u00F6\u00DFe</b><br/>Wird diese Bedingung nicht erf\u00FCllt, dann werden die Gr\u00F6\u00DFen bei der Auswertung intern umgeordnet, so dass es passt.<br/><br/>Im Folgenden seind ein paar Beispiele aufgef\u00FChrt, die die Auswirkungen verschiedener Gr\u00F6\u00DFeneingaben verdeutlichen sollen:<br/><br/><b>Beispiel 1:</b><br/>Mindestgr\u00F6\u00DFe: keine Angabe (=0)<br/>Bevorzugte Gr\u00F6\u00DFe: keine Angabe (=0)<br/>Maximalgr\u00F6\u00DFe: keine Angabe (=0)<br/>Ergebnis: Die K\u00F6rpergr\u00F6\u00DFe wird bei der Vorschlagssuche nicht ber\u00FCcksichtigt<br/><br/><b>Beispiel 2:</b><br/>Mindestgr\u00F6\u00DFe: 165 cm<br/>Bevorzugte Gr\u00F6\u00DFe: 175 cm<br/>Maximalgr\u00F6\u00DFe: 180 cm<br/>Ergebnis: Es werden bevorzugt Personen mit einer K\u00F6rpergr\u00F6\u00DFe um die 175 cm vorgeschlagen, je weiter sich die Person von dieser K\u00F6rpergr\u00F6\u00DFe entfernt, desto unwahrscheinlicher wird ein Vorschlag. Es ist bei dieser Konstellation aber m\u00F6glich, wenn auch unwahrscheinlich , dass auch eine Person vorgeschlagen wird, die etwa 2-3 cm unter der Mindestgrenze liegt oder \u00FCber der H\u00F6chstgrenze. Die Grenzen sind also nicht ganz scharf.<br/><br/><b>Beispiel 3:</b><br/>Mindestgr\u00F6\u00DFe: 165 cm<br/>Bevorzugte Gr\u00F6\u00DFe: keine Angabe (=0)<br/>Maximalgr\u00F6\u00DFe: 180 cm<br/>Ergebnis: Es werden ausschlie\u00DFlich Personen mit einer K\u00F6rpergr\u00F6\u00DFe zwischen 165 und 180 cm vorgeschlagen. Diese aber alle mit der gleichen Wahrscheinlichkeit. Eine \u00DCberschreitung der Grenzen findet nicht statt, es werden also keine Personen vorgeschlagen, die kleiner sind als 165 cm oder gr\u00F6\u00DFer als 180 cm.<br/><br/><b>Beispiel 4:</b><br/>Mindestgr\u00F6\u00DFe: keine Angabe (=0)<br/>Bevorzugte Gr\u00F6\u00DFe: 175 cm<br/>Maximalgr\u00F6\u00DFe: keine Angabe (=0)<br/>Ergebnis: Es werden mit h\u00F6herer Wahrscheinlichkeit Personen vorgeschlagen, die um die 175 cm gro\u00DF sind, es k\u00F6nnen aber auch Personen jeder anderen Gr\u00F6\u00DFe vorgeschlagen werden, wenn diese bez\u00FCglich anderer Kriterien gut passen. (Sie k\u00F6nnen nat\u00FCrlich auch nur die Unter- oder nur die Obergrenze weglassen, dann gibt es nur bez\u00FCglich dieser Gr\u00F6\u00DFe keine Beschr\u00E4nkung.)<br/><br/><br/>Im Allgemeinen ist zu empfehlen, eine bevorzugte K\u00F6rpergr\u00F6\u00DFe einzugeben (nat\u00FCrlich nur, sofern Ihnen dieses Kriterium wichtig ist) und die Grenzen je nach Einsch\u00E4tzung der eigenen Toleranz zu w\u00E4hlen. Es ist allerdings dabei zu bedenken, dass eine zu enge Wahl der Gr\u00F6\u00DFengrenzen je nach Einstellung der anderen Suchgr\u00F6\u00DFen eine geringe Vorschlagszahl oder auch gar keine Vorschl\u00E4ge zur Folge haben kann.

fieldset.altersbereich=Es gibt mehrere M\u00F6glichkeiten, den Altersbereich der gesuchten Personen den eigenen W\u00FCnschen gem\u00E4\u00DF einzuschr\u00E4nken. Im Folgenden soll erl\u00E4utert werden, wie die entsprechenden Gr\u00F6\u00DFen einzustellen sind, damit das gew\u00FCnschte Suchverhalten erzielt werden kann.<br/><br/>Zun\u00E4chst einmal zur Erl\u00E4uterung der drei Suchgr\u00F6\u00DFen:<br/><br/>Das <b>Mindestalter</b> gibt an, wie alt die gesuchte Person mindestens sein sollte.<br/>Das <b>bevorzugte Alter</b> gibt an, welches Alter bei der gesuchten Person bevorzugt gew\u00FCnscht wird.<br/>Das <b>Maximalalter</b> gibt an, wie alt die gesuchte Person h\u00F6chstens sein sollte.<br/><br/>Alle drei Gr\u00F6\u00DFen k\u00F6nnen in verschiedenen Kombinationen angegeben oder weggelassen werden, was verschiedene Auswirkungen hat. Es mu\u00DF bei angegegebenen Werten allerdings folgende Bedingung erf\u00FCllt sein:<br/><b>Mindestalter</b> kleiner <b>Bevorzugtes Alter</b> kleiner <b>Maximalalter</b><br/>Wird diese Bedingung nicht erf\u00FCllt, dann werden die Gr\u00F6\u00DFen bei der Auswertung intern umgeordnet, so dass es passt.<br/><br/>Im folgenden ein paar Beispiele, die die Auswirkungen verschiedener Alterseingaben verdeutlichen sollen:<br/><br/><b>Beispiel 1:</b><br/>Mindestalter: keine Angabe (=0)<br/>Bevorzugtes Alter: keine Angabe (=0)<br/>Maximalalter: keine Angabe (=0)<br/>Ergebnis: Das Alter wird bei der Vorschlagssuche nicht ber\u00FCcksichtigt<br/><br/><b>Beispiel 2:</b><br/>Mindestalter: 30<br/>Bevorzugtes Alter: 40<br/>Maximalalter: 45<br/>Ergebnis: Es werden bevorzugt Personen mit einem Alter um die 40 vorgeschlagen, je weiter sich die Person von diesem Alter entfernt, desto unwahrscheinlicher wird ein Vorschlag. Es ist bei dieser Konstellation aber m\u00F6glich, wenn auch unwahrscheinlich , dass auch eine Person vorgeschlagen wird, die 1-2 Jahre unter der Mindestgrenze liegt oder \u00FCber der H\u00F6chstgrenze. Die Grenzen sind also nicht ganz scharf.<br/><br/><b>Beispiel 3:</b><br/>Mindestalter: 30<br/>Bevorzugtes Alter: keine Angabe (=0)<br/>Maximalalter: 45<br/>Ergebnis: Es werden ausschlie\u00DFlich Personen die zwischen 30 und 45 Jahren alt sind, vorgeschlagen. Diese aber alle mit der gleichen Wahrscheinlichkeit. Eine \u00DCberschreitung der Grenzen findet nicht statt, es werden also keine Personen vorgeschlagen, die j\u00FCnger als 30 oder \u00E4lter als 45 sind.<br/><br/><b>Beispiel 4:</b><br/>Mindestalter: keine Angabe (=0)<br/>Bevorzugtes Alter: 40<br/>Maximalalter: keine Angabe (=0)<br/>Ergebnis: Es werden mit h\u00F6herer Wahrscheinlichkeit Personen um die 40 vorgeschlagen, es k\u00F6nnen aber auch Personen jeden anderen Alters vorgeschlagen werden, wenn diese bez\u00FCglich anderer Kriterien gut passen. (Sie k\u00F6nnen nat\u00FCrlich auch nur die Unter- oder nur die Obergrenze weglassen, dann gibt es nur bez\u00FCglich dieser Gr\u00F6\u00DFe keine Beschr\u00E4nkung.)<br/><br/><br/>Im Allgemeinen ist zu empfehlen, ein bevorzugtes Alter einzugeben und die Grenzen je nach Einsch\u00E4tzung der eigenen Toleranz zu w\u00E4hlen. Es ist allerdings dabei zu bedenken, dass eine zu enge Wahl der Altersgrenzen je nach Einstellung der anderen Suchgr\u00F6\u00DFen eine geringe Vorschlagszahl oder auch gar keine Vorschl\u00E4ge zur Folge haben kann.
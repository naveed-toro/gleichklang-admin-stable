text.instruktion_person=Geben Sie jetzt einige weitere Angaben zu Ihrer Person und Ihrem Lebensumfeld. Diese Angaben werden zu Ihnen passenden Mitgliedern als Teil des Vermittlungsvorschlages gezeigt.
text.instruktion_aussehen=Beschreiben Sie jetzt kurz Ihr \u00C4u\u00DFeres. Ihre Angaben werden zu Ihnen passenden Mitgliedern als Teil des Vermittlungsvorschlages gezeigt.
text.instruktion_partner=Geben Sie jetzt an, was Sie f\u00FCr einen Menschen f\u00FCr eine Partnerschaft suchen. Dies betrifft auch \u00E4u\u00DFere Merkmale, wie den Wohnort und der f\u00FCr Sie in Frage kommende Altersbereich. Es betrifft aber ebenfalls z.B. die Ern\u00E4hrungsweise oder andere besondere Lebensgewohnheiten.\n\nEs ist empfehlenswert bei den angegebenen W\u00FCnschen und Erwartungen so wenig wie m\u00F6glich Einschr\u00E4nkungen zu machen. Ein weniger eingeschr\u00E4nkter Suchraum ist mit gr\u00F6\u00DFeren Erfolgschancen verbunden. Geben Sie aber Einschr\u00E4nkungen trotzdem ein, wenn sie unbedingt notwendig sind.
text.instruktion_freund=Geben Sie jetzt an, was Sie f\u00FCr einen Menschen f\u00FCr eine Freundschaft suchen. Dies betrifft auch \u00E4u\u00DFere Merkmale, wie den Wohnort und der f\u00FCr Sie in Frage kommende Altersbereich. Es betrifft aber ebenfalls z.B. die Ern\u00E4hrungsweise oder andere besondere Lebensgewohnheiten.\n\nEs ist empfehlenswert bei den angegebenen W\u00FCnschen und Erwartungen so wenig wie m\u00F6glich Einschr\u00E4nkungen zu machen. Ein weniger eingeschr\u00E4nkter Suchraum ist mit gr\u00F6\u00DFeren Erfolgschancen verbunden. Geben Sie aber Einschr\u00E4nkungen trotzdem ein, wenn sie unbedingt notwendig sind.
text.instruktion_hobby_e=Geben Sie jetzt Ihre allgemeinen Interessen an.Zur Beantwortung der Fragen steht Ihnen eine f\u00FCnfstufige Skala zur Verf\u00FCgung. Kreuzen Sie bitte an:\n\n1 Stimme nicht zu: Wenn Sie auf keinen Fall zustimmen.\n2 Stimme eher nicht zu: Wenn Sie eher nicht zustimmen.\n3 Unentschieden:  Wenn Sie unentschieden sind.\n4 Stimme zu: Wenn Sie zustimmen.\n5 Stimme stark zu:  Wenn Sie nachdr\u00FCcklich zustimmen.\n\n${instruktion_tastatur_skala_eingabe}
text.instruktion_hobby_v=Kreuzen Sie jetzt Ihre Hobbys an. Geben Sie nur solche Hobbys an, die Ihnen wirklich wichtig f\u00FCr Ihr Leben sind! Ihre Angaben werden zu Ihnen passenden Mitgliedern als Teil des Vermittlungsvorschlages gezeigt.
text.instruktion_persoenlichkeit=Im Folgenden finden Sie eine Reihe von Aussagen, die sich zur Beschreibung Ihres Erlebens und Verhaltens eignen. Lesen Sie bitte jede Aussage aufmerksam durch und kreuzen Sie diejenige Antwort an, die Ihrer Ansicht nach am besten zutrifft. Bitte antworten Sie spontan und ohne lange \u00FCber eine Aussage nachzudenken. Die erste spontane Antwort ist in der Regel die beste. Auch wenn Ihnen einmal die Entscheidung schwer fallen sollte, ist es wichtig, dass Sie die am ehesten zutreffende Antwortm\u00F6glichkeit w\u00E4hlen. Bitte lassen Sie keine Aussage aus, da sonst eine Auswertung nicht m\u00F6glich ist. Bitte antworten Sie ehrlich. Kreuzen Sie bitte an:\n\n(1) Starke Ablehnung: Wenn Sie auf keinen Fall zustimmen.\n(2) Ablehnung: Wenn Sie eher nicht zustimmen.\n(3) Neutral:  Wenn Sie weder zustimmen noch nicht zustimmen.\n(4) Zustimmung: Wenn Sie eher zustimmen.\n(5) Starke Zustimmung:  Wenn Sie nachdr\u00FCcklich zustimmen.
text.instruktion_adjektive=Im folgenden stehen sich  immer zwei Worte gegen\u00FCber, die das Gegenteil bedeuten. Sie sollen entscheiden, welches der beiden Worte am ehesten auf Sie zutrifft.  Wenn z.B. das linke Wort vollkommen zutrifft, dann kreuzen Sie bitte die 2 auf der linken Seite an. Wenn dagegen das rechte Wort vollkommen zutrifft, kreuzen Sie bitte die 2 auf der rechten Seite an. Wenn das linke Wort zwar zutrifft, aber nicht vollkommen zutrifft, kreuzen Sie die 1 auf der linken Seite an. Wenn dagegen das rechte Wort zwar zutrifft, aber nicht vollkommen zutrifft, kreuzen Sie die 1 auf der rechten  Seite an. Kreuzen Sie 0 an, wenn Sie sich nicht entscheiden k\u00F6nnen, weil beide Worte nicht zutreffen.\n\n${instruktion_tastatur_skala_eingabe}
text.instruktion_partnerschaft=Geben Sie jetzt an, was Ihnen in einer Partnerschaft wichtig ist. Zur Beantwortung der Fragen steht Ihnen eine f\u00FCnfstufige Skala zur Verf\u00FCgung. Kreuzen Sie bitte an:\n\n(1) Stimme nicht zu:  Wenn Sie auf keinen Fall zustimmen.\n(2) Stimme eher nicht zu: Wenn Sie eher nicht zustimmen.\n(3) Unentschieden:  Wenn Sie unentschieden sind.\n(4) Stimmme zu: Wenn Sie zustimmen.\n(5) Stimme stark zu:  Wenn Sie nachdr\u00FCcklich zustimmen.\n\n${instruktion_tastatur_skala_eingabe}
text.instruktion_freundschaft=Geben Sie jetzt an, was Ihnen in einer Freundschaft wichtig ist. Zur Beantwortung der Fragen steht Ihnen eine f\u00FCnfstufige Skala zur Verf\u00FCgung. Kreuzen Sie bitte an:\n\n(1) Stimme nicht zu:  Wenn Sie auf keinen Fall zustimmen.\n(2) Stimme eher nicht zu: Wenn Sie eher nicht zustimmen.\n(3) Unentschieden:  Wenn Sie unentschieden sind.\n(4) Stimmme zu: Wenn Sie zustimmen.\n(5) Stimme stark zu:  Wenn Sie nachdr\u00FCcklich zustimmen.\n\n${instruktion_tastatur_skala_eingabe}
text.instruktion_gesellschaft=Es bestehen gro\u00DFe Unterschiede dahingehend, welche Einstellungen Menschen zu allgemeinen gesellschaftlichen Themen haben.\n\nBitte bewerten Sie die folgenden Aussagen zu gesellschaftlichen Themen. Es gibt keine richtigen oder falschen Antworten, vielmehr geht es um Ihre pers\u00F6nlichen Ansichten. Zur Bewertung steht Ihnen eine f\u00FCnfstufige Skala zur Verf\u00FCgung. Kreuzen Sie bitte an:\n\n(1) Stimme nicht zu:  Wenn Sie auf keinen Fall zustimmen.\n(2) Stimme eher nicht zu: Wenn Sie eher nicht zustimmen.\n(3) Unentschieden:  Wenn Sie unentschieden sind.\n(4) Stimmme eher zu: Wenn Sie zustimmen.\n(5) Stimme zu:  Wenn Sie nachdr\u00FCcklich zustimmen.\n\n${instruktion_tastatur_skala_eingabe}
text.instruktion_kritische_lebensereignisse=Im Leben eines jeden Menschen gibt es mehr oder weniger kritische und oftmals auch belastende Ereignisse. Im folgenden sind einige derartiger Ereignissen aufgelistet. Bitte geben Sie an, ob Sie diese Ereignisse erlebt haben, bzw. wenn Sie sie erlebt haben, wie bedeutsam diese Erlebnisse f\u00FCr Sie HEUTE noch sind:\n\n(1) Nicht erlebt\n(2) erlebt, aber nicht bedeutsam\n(3) erlebt, aber wenig bedeutsam\n(4) erlebt und bedeutsam\n(5) erlebt und sehr bedeutsam.\n\n Folgendes ist wichtig: Sie sollen immer angeben, wie bedeutsam ein Ereignis, welches Sie bereits  erlebten, zum gegenw\u00E4rtigen Zeitpunkt f\u00FCr Sie ist. Wenn z.B. eine lang zur\u00FCckliegende Trennung f\u00FCr Sie heute keinerlei innere Bedeutsamkeit mehr hat, geben Sie bitte an: Erlebt, aber nicht bedeutsam. Erfasst wird also die Bedeutsamkeit, die Sie einem Ereignis heute zusprechen, nicht, wie Sie es damals erlebten.\n\n${instruktion_tastatur_skala_eingabe}
text.instruktion_ptext=Schreiben Sie ein paar S\u00E4tze zu Ihrer eigenen Vorstellung. Sie k\u00F6nnen einen g\u00E4nzlich frei formulierten Text schreiben und/oder bis zu drei ausgew\u00E4hlte Satzanf\u00E4nge vervollst\u00E4ndigen. Dies gibt Ihnen die M\u00F6glichkeit, \u00FCber den festen Rahmen der Frageb\u00F6gen hinaus den anderen Teilnehmenden einen ersten Eindruck zu vermitteln. Viele Teilnehmer legen beim Lesen von Vermittlungsvorschl\u00E4gen gro\u00DFen Wert auf einen freien Text.\nSie k\u00F6nnen zun\u00E4chst die freien Texte bei der Anmeldung \u00FCberspringen. Wir empfehlen, dies sp\u00E4ter nachzuholen. Alle Texte k\u00F6nnen zu jeder Zeit ge\u00E4ndert werden.
text.instruktion_ftext=Schreiben Sie ein paar S\u00E4tze zu Ihrer eigenen Vorstellung. Sie k\u00F6nnen einen g\u00E4nzlich frei formulierten Text schreiben und/oder bis zu drei ausgew\u00E4hlte Satzanf\u00E4nge vervollst\u00E4ndigen. Dies gibt Ihnen die M\u00F6glichkeit, \u00FCber den festen Rahmen der Frageb\u00F6gen hinaus den anderen Teilnehmenden einen ersten Eindruck zu vermitteln. Viele Teilnehmer legen beim Lesen von Vermittlungsvorschl\u00E4gen gro\u00DFen Wert auf einen freien Text.\nSie k\u00F6nnen zun\u00E4chst die freien Texte bei der Anmeldung \u00FCberspringen. Wir empfehlen, dies sp\u00E4ter nachzuholen. Alle Texte k\u00F6nnen zu jeder Zeit ge\u00E4ndert werden.

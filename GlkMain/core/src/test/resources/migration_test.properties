#
# Properties to run migration tests
#

# ${migration.schema} will be replaced by maven
# and allows us to select a migration test schema by setting the system property migration.schema
# e.g. via:
#   mvn clean install -Dmigration.schema=gleichklang_migration
db.jdbc.url=jdbc:mysql://mysql0.core.binaere-bauten.de/${migration.schema}?useUnicode=true&characterEncoding=UTF-8&logger=com.mysql.jdbc.log.Slf4JLogger&logSlowQueries=true&explainSlowQueries=true&slowQueryThresholdMillis=200&rewriteBatchedStatements=true

db.user=gleichklang
db.password=gleichklang

db.connection.pool.max.active=100
db.connection.pool.max.idle=100
db.connection.pool.remove.abandoned.timeout=86400

db.auto.flyway.repair=true

file.path=gk/files
server.base_url=http://avior.core.binaere-bauten.de:8080/Gleichklang/

email.gk_social.scheduler_enabled=false

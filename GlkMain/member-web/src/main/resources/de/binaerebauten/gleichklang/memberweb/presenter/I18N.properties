PREREGISTRATION_VALIDATION_EMAILALREADYUSED=\
  Mit der eingegebenen E-mail ist eine Neuregistrierung nicht m\u00F6glich. Dies kann an verschiedenen Gr\u00FCnden liegen. \
  Wenn Sie bereits mit dieser E-mail einen Account haben, gehen Sie bitte zur <a href={0}>Login-Seite</a>. \
  Loggen Sie sich ein, um den Account zu reaktivieren oder alles neu einzugeben. Wenn Sie Ihr Passwort vergessen haben, \
  nutzen Sie die Passwort-Vergessens-Funktion. Wenn Sie noch keinen Account bei uns mit dieser E-mail haben, nutzen Sie \
  bitte eine andere E-mail, da diese E-mail durch uns nicht angenommen werden kann.

RELATIONSHIPRESENTER_NOTIFICATION_EMPTYRELATIONSHIPS=\
  Bitte beachten Sie, dass die ersten Vorschl\u00E4ge bis zu 12 Stunden dauern k\u00F6nnen, da der Zuteilungs-Algorithmus mehrere Stunden f\u00FCr die Berechnungen ben\u00F6tigt!\n\
  Alle Vorschl\u00E4ge werden in dieser Liste dargestellt. Sie k\u00F6nnen die Liste durch verschiedene Filter und Ordner durchsuchen. Durch Klick auf einen Vorschlag wird das jeweilige Profil ge\u00F6ffnet.\n\
  Gleichklang steht f\u00FCr das Prinzip "Vermittlung bis zum Erfolg". Schrittweise gehen Vorschl\u00E4ge ein bis die passende Person gefunden ist.\n\
  \n\
  Sollten Sie auch nach mehr als 24h noch keinen Vorschlag von uns erhalten haben, dann wenden Sie sich bitte an unseren Support.

ACCOUNT_CAN_BE_CANCELED=Bei Ihnen steht noch eine Bezahlung aus. Sie können Ihren Account kündigen, aber dies ändert nichts an Ihrer Verplichtung, die Bezahlung zu leisten.\n\n Betrag von {0}\n Verwendungszweck {1} \n\n Unsere Bankverbindung: \n {2} Kontonummer: {3} BLZ: {4} \n IBAN: {5}\n BIC: {6} \n\nWenn Sie Ihr Konto kündigen, können Sie dies Konto nicht mehr nutzen. Für die ausstehende Zahlung sind Sie aber weiterhin zahlungspflichtig und werden entsprechend auch Mahnungen per Email erhalten. Sollte Ihrerseits Unklarheit über die offene Zahlung bestehen, kontaktieren Sie bitte das Team von Gleichklang zur Klärung.\n\n Mir ist dies bewusst und ich akzeptiere dies.
ACCOUNT_CAN_NOT_BE_DELETED=Da noch eine Zahlung ausssteht, können Sie Ihren Zugang nicht löschen. Wenn Sie die Zahlung geleistet haben, ist eine Löschung möglich.\n\n Betrag von {0} \n Verwendungszweck {1} \n\n Unsere Bankverbindung: \n {2} Kontonummer: {3} BLZ: {4} \n IBAN: {5}\n BIC: {6} \n\nWenn Sie die Zahlung geleistet haben, können Sie Ihr Konto auf Wunsch danach löschen. Für die ausstehende Zahlung werden Sie weiterhin Mahnungen per Email erhalten. Sollte eine Unklarheit über die ausstehende Zahlung erhalten, wenden Sie sich bitte an das Geichklang-Team.
CONFIRM_DELETE_AUDIO=Möchten Sie das Audio wirklich löschen?
CANNOT_ADD_AUDIO=Sie haben bereits zwei Audio-Dateien hochgeladen und sie jeweils einer Vermittlungs-Rubrik (Partnerschaft, Freundschaft) zugewiesen. Es kann immer nur eine Audio-Datei für eine Vermittlungskategorie hochgeladen werden. Wenn Sie die Audio-Datei für beide Rubriken wechseln wollen, löschen Sie beide Dateien (Klick auf Papierkorb). Jetzt können sie eine Datei für beide Rubriken oder zwei Dateien, jeweils für eine Rubrik, neu hochladen. Wenn Sie die Datei nur für eine Rubrilk wechseln wollen, löschen Sie die Datei dieser Rubrik. Jetzt können Sie eine neue Datei für diese Rubrik hochladen. Oder Sie können auf den Stift der einen noch verfügbaren Datei klicken und diese nunmehr beiden Rubriken (Partnerschaft, Freundschaft) zuweisen.
CANNOT_ADD_AUDIOS=Sie haben bereits eine Audiodatei hochgeladen und einer Kategorie zugeordnet (Partnerschaft oder Freundschaft). Sie können immer nur eine Audiodatei für eine Kategorie hochladen. Wenn Sie die Audiodatei für eine Kategorie ändern möchten, löschen Sie die Datei (klicken Sie auf den Papierkorb). Jetzt können Sie eine Datei für eine Kategorie erneut hochladen. Wenn Sie die Datei nur für eine Kategorie ändern möchten, löschen Sie die Datei in dieser Kategorie. Jetzt können Sie eine neue Datei für diese Kategorie hochladen.
CANNOT_ADD_AUDIO_BOTH_CATEGORIES_UPLOADED=Sie haben bereits eine Audio-Datei hochgeladen und sie beiden Vermittlungs-Rubriken (Partnerschaft, Freundschaft) zugewiesen. Es kann immer nur eine Audio-Datei für eine Vermittlungskategorie hochgeladen werden. Wenn Sie die Audio-Datei für beide Rubriken wechseln wollen, löschen Sie zunächst die Datei (Klick auf Papierkorb) und laden Sie dann die neue Datei hoch. Wenn sie die Audio-Datei nur für eine Rubrik wechseln wollen, klicken Sie auf den Stift und entfernen Sie den Haken bei der Rubrik. Jetzt können Sie eine neue Datei hochladen.
SAME_AUDIO_ALREADY_UPLOADED=Diese Audio-Datei ist bereits hochgeladen. Eine bereits hochgeladene Datei kann nicht ein zweites Mal hochgeladen werden
CLICK_SAVE_TO_SAVE=Auf Speichern klicken, um die Audio-Datei\u0020
TO_PROFILE=in Ihrem \u0020Profil zu speichern.
Before_Close = Bitte drücken Sie zunächst auf Speichern, bevor Sie das Fenster schließen.
FILETYPEEXCEPTION =Diese Audiodatei wird leider nicht unterstützt. Bitte nutzen Sie eines der im Beschreibungstext angegegebenen Formate.
SIZEEXCEPTION =Diese Datei ist zu groß, um unterstützt zu werden. Versuchen Sie es mit einer kleineren Datei.
REPEATCATEGORY = Audio wurde für diese Kategorie hochgeladen
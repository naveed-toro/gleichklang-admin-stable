REGISTRATIONVIEW_RULES_DESCRIPTION=I agree with the <a href="{0}" target="_blank">General Terms and Conditions (GTC)</a> and the <a href="{1}" target="_blank">Privacy Policy</a> and accept the <a href="{0}" target="_blank">cancellation policy</a>. I will also adhere to the <a href="{2}" target="_blank">rules</a> of friendly and compassionate interaction as a member of the Gleichklang community.<br>\
  <br>\
  I agree with the storage and processing of my data for the provision of the services I want to use (dating and / or friend search). I also agree with the storage and processing of the most sensitive sexual data required to engage in partnerships (for example, knowing sexual orientation to be able to make a proposition at all). If I provide additional sensitive information on sexuality, health (such as the presence of a handicap), or my socio-political attitudes, I agree with their storage and processing for the purpose of supporting my dating or friendships. I agree with the privacy policy of Gleichklang. I know that I can withdraw my consent to data processing at any time and have a right to correct my data and to be forgotten (data deletion).

MEDIAGALLERY_HEADER_DESCRIPTION=Here, you can upload photos and place them in various galleries. For each gallery, you can decide whether it should be shown to all people or only certain people. If you do not make any restrictions, the gallery will always be shown to all people. To create a new gallery, just click on \u201CNew gallery\u201C. You can now create a new gallery and then upload photos into this gallery. To upload photos into a gallery, click on the gallery. You can also upload new photos into a gallery later on at any time by clicking on the gallery. Additionally, you can delete a gallery by clicking on the Recycle Bin. A gallery can be edited by clicking on the pencil icon. 
#AUDIOGALLERY_HEADER_DESCRIPTION=Here, you can upload audio and attach them to categories. For each audio, you can decide whether it should be shown to all people or only certain people. If you do not make any restrictions, the audio will always be shown to all people. To upload a new audio, just click on \u201C + button below \u201C. Additionally, you can delete an audio by clicking on the delete button. A catgory for audio can be edited by clicking on the edit button.
AUDIOGALLERY_HEADER_DESCRIPTION=You have the opportunity to tell something about yourself with your own voice. Because the voice can be an important feature in the search for a partner and a friend. Here you can create or upload a recording of your own voice and then assign it to a mediation category. To upload an audio file or to create a new recording, simply click on the button "Add audio greeting". You can also delete a recording by clicking the "Delete" button. The category of a recording can be edited by clicking the "Edit" button.
AUDIOGALLERY_HEADER_RECORD_DESCRIPTION=Please make sure that a microphone is properly connected to your computer and that you have granted all necessary access to it. You may need to globally grant permission to use the microphone at the operating system level and at the browser level.
AUDIOGALLERY_HEADER_UPLOAD_DESCRIPTION="Here you can upload an existing recording. For example, you can create a recording using an audio recorder app on your smartphone. Recording must be in WAV (mono & stereo, 16bit, uncompressed, 11,025 - 48 kHz) or MP3 (mono & stereo, 44.1 kHz, cbr 8 - 320 If your file is not supported, please use an audio converter, such as <a href="{0}" target="_blank" style="color: white;">https://online-audio-converter.com/de/</a>.

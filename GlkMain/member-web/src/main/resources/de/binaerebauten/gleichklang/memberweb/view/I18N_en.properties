CANCELATIONPANEL_ACTION_CANCELSUBSCRIPTION=Cancel
CANCELATIONPANEL_CAPTION_CANCELATION=Cancellation
CANCELATIONPANEL_DESCRIPTION_CANCELATION=If you want to terminate your participation prematurely and immediately, your access will be closed immediately after sending the cancellation. Please do not confuse this termination without notice with the cancellation of the extension.
CANCELATIONPANEL_DESCRIPTION_CANCELATION1= If you want to use your booked participation, but are already sure not to request an extension, you can <a href="./#!DEACTIVATE_PROLONGATION" style="color:black"> issue your extension here </a>.
CANCELATIONPANEL_DESCRIPTION_CANCELATION2= We do not recommend this step, as the search for partners and friends often takes a long time. Many members of Harmonize have found partnership or friendship because they have not given up their resignation. Ultimately, it is only a matter of time before a suitable person with whom a relationship is established is met. So stay with us and <a href="./#!MESSAGE_TO_GLEICHKLANG" style="color:black"> contact the team </a>
CANCELATIONPANEL_DESCRIPTION_CANCELATION3=Sie haben die automtische Verlängerung bereits abgeschaltet. 
CANCELATIONPANEL_CAPTION_DELETETITLE = CANCEL WITHOUT TERM - WHAT SHOULD BE AFTER?
CANCELATIONPANEL_CAPTION_DELETEYES = I do not want to be able to reactivate my account later. I want my member account to be deleted. This means that all of my old suggestions and messages received are irrevocably lost. If I want to become a member of Gleichklang again, I have to reenter everything and start from scratch. Payment data is saved for 10 years even if the account is deleted. If I delete the account, I acknowledge all payments that have already been made and will not reclaim or post amounts. I am expressly aware that an extension that has already occurred cannot be canceled by deletion. I am also aware that I only see a payment that has just been made in my account a few days later. No repayment will be made in this case either, which I expressly acknowledge with the deletion.
CANCELATIONPANEL_CAPTION_DELETENO = I would like to keep it open to myself, maybe later to reactivate my member account and maybe also to be able to use the old suggestions and messages again. I therefore want the account to be terminated but not deleted. At this point in time, if I decide to become a member again, I can decide whether I want to start over from the old account or re-enter everything.
CANCELATIONPANEL_CAPTION_SAVEMAILTITLE = Keep in touch?
CANCELATIONPANEL_CAPTION_SAVEMAILYESWITHDELETED = I would like to continue to receive information about consonance, relationship psychology, promotions, special offers and surveys by email at irregular intervals. This is the only way to keep my email in case of unison. I can unsubscribe from this information at any time with an unsubscribe link. I can have my email deleted at any time.
CANCELATIONPANEL_CAPTION_SAVEMAILNOWITHDELETED = I would like my e-mail to be completely deleted from the Gleichklang member area. [Gleichklang uses other, technically unlinked systems for sending messages. To stop receiving e-mails from there as well, I use the unsubscribe link contained in the messages or write a corresponding message to anfragen@gleichklang.de].
CANCELATIONPANEL_CAPTION_SAVEMAILYES = I would like to continue to receive information about consonance, relationship psychology, promotions, special offers and surveys by email at irregular intervals. I can unsubscribe from this information at any time with an unsubscribe link. I can have my information deleted at any time.
CANCELATIONPANEL_CAPTION_SAVEMAILNO = I do not want to receive any other email messages from Gleichklang.
BREAKPANEL_CAPTION_DESCRIPTION=You can temporarily suspend the service if you wish not to receive suggestions from us for a period of time (e.g. if you are away or have already met somebody and do not want any further contacts for the time being).butt1caption ="" 

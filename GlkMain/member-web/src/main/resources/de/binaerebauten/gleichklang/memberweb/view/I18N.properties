CANCELATIONPANEL_ACTION_CANCELSUBSCRIPTION=K\u00FCndigen
CANCELATIONPANEL_CAPTION_CANCELATION=Fristlos K\u00FCndigen
CANCELATIONPANEL_DESCRIPTION_CANCELATION=Falls Sie Ihre Teilnahme vorzeitig und umgehend beenden möchten, wird Ihr Zugang sofort nach dem Abschicken der Kündigung geschlossen. Bitte verwechseln Sie diese fristlose Kündigung nicht mit der Abstellung der Verlängerung. 
CANCELATIONPANEL_DESCRIPTION_CANCELATION1=Wenn Sie Ihre gebuchte Teilnahme nutzen wollen, aber bereits sicher sind, keine Verlängerung zu wünschen, können <a href="./#!DEACTIVATE_PROLONGATION" style="color:black">Sie Ihre Verlängerung hier ausstellen</a>. 
CANCELATIONPANEL_DESCRIPTION_CANCELATION2=Wir raten von diesem Schritt ab, da Partner- und Freundschaftssuche oft längere Zeit dauern. Es haben schon viele Mitglieder von Gleichklang Partnerschaft oder Freundschaft gefunden, weil Sie doch auf eine Kündigung verzichtet haben. Letztlich ist es nämlich nur eine Frage der Zeit, bis der eine passende Mensch kennengelernt wird, mit dem eine Beziehung entsteht. Bleiben Sie also bei uns und  <a href="./#!MESSAGE_TO_GLEICHKLANG" style="color:black">wenden Sie sich an das Team </a>
CANCELATIONPANEL_DESCRIPTION_CANCELATION3=Sie haben die automtische Verlängerung bereits abgeschaltet. 
CANCELATIONPANEL_CAPTION_DELETETITLE=FRISTLOS KÜNDIGEN - WAS SOLL DANACH SEIN?
CANCELATIONPANEL_CAPTION_DELETEYES=Ich verzichte darauf, dass ich meinen Account später einmal wieder reaktivieren kann. Ich möchte, dass mein Mitglieder-Account gelöscht wird. Damit gehen auch alle meine alten Vorschläge und erhaltenen Nachrichten unwiderruflich verloren. Wenn ich wieder Mitglied bei Gleichklang werden möchte, muss ich alles neu eingeben und komplett neu anfangen. Zahlungsdaten werden auch bei Löschung des Accounts 10 jahre gespeichert. Wenn ich den Account lösche, erkenne ich alle bereits erfolgten Zahlungen an und werde keine Beträge mehr zurückfordern oder zurückbuchen. Ausdrücklich ist mir bewusst, dass eine bereits eingetretene Verlängerung nicht durch Löschung rückgängig gemacht werden kann. Dabei ist mir ebenfalls bewusst, dass ich eine soeben erfolgte Zahlung immer erst einige Tage später auf meinem Konto sehe. Eine Rückzahlung erfolgt auch in diesem Fall nicht, was ich ausdrücklich mit der Löschung anerkenne.
CANCELATIONPANEL_CAPTION_DELETENO=Ich m\u00F6chte es mir offen halten, vielleicht sp\u00E4ter einmal wieder meinen Mitglieder-Account zu reaktivieren und vielleicht auch wieder auf die alten Vorschl\u00E4ge und Nachrichten zur\u00FCckgreifen zu k\u00F6nnen. Ich m\u00F6chte daher, dass der Account gek\u00FCndigt, aber nicht gel\u00F6scht wird. Wenn ich mich erneut f\u00FCr eine Mitgliedschaft entscheide, kann ich zu diesem Zeitpunkt entscheiden, ob ich auf der Basis des alten Accounts neu beginnen oder alles neu eingeben m\u00F6chte.
CANCELATIONPANEL_CAPTION_SAVEMAILTITLE=Weiter in Kontakt bleiben?
CANCELATIONPANEL_CAPTION_SAVEMAILYESWITHDELETED=Ich m\u00F6chte weiterhin Informationen \u00FCber Gleichklang, Psychologie von Beziehungen, Aktionen, besondere Angebote und Umfragen per Email in unregelm\u00E4\u00DFigen Abst\u00E4nden erhalten k\u00F6nnen. Nur hierf\u00FCr soll meine E-Mail bei Gleichklang erhalten bleiben. Ich kann diese Informationen jederzeit mit einem Abmeldelink wieder abbestellen. Ich kann meine E-Mail jederzeit l\u00F6schen lassen.
CANCELATIONPANEL_CAPTION_SAVEMAILNOWITHDELETED=Ich m\u00F6chte, dass meine E-Mail komplett aus dem Gleichklang-Teilnahmebereich gel\u00F6scht wird. \n [Gleichklang verwendet weitere, technisch nicht verkn\u00FCpfte Systeme f\u00FCr den Nachrichtenversand. Um auch von dort keine E-Mails mehr zu erhalten, verwende ich den in den Nachrichten enthaltenen Abmeldelink oder schreibe eine entsprechende Nachricht an anfragen@gleichklang.de]
CANCELATIONPANEL_CAPTION_SAVEMAILYES=Ich m\u00F6chte weiterhin Informationen \u00FCber Gleichklang, Psychologie von Beziehungen, Aktionen, besondere Angebote und Umfragen per Email in unregelm\u00E4\u00DFigen Abst\u00E4nden erhalten. Ich kann diesen Informationen jederzeit mit einem Abmeldelink wieder abbestellen. Ich kann meine Informationen jederzeit l\u00F6schen lassen.
CANCELATIONPANEL_CAPTION_SAVEMAILNO=Ich m\u00F6chte keine weitere E-Mail Nachrichten von Gleichklang erhalten.


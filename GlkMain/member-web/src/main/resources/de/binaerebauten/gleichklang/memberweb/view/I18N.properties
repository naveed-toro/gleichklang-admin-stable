USERDATA_PERSONALINFO_DESCRIPTION=<p>Sie k\u00F6nnen hier Ihre Anschrift \u00E4ndern, eine weitere Anschrift hinzuf\u00FCgen (z.B. Zweitwohnsitz, Urlaubsanschrift), Passwort und Email \u00E4ndern, Nachrichten von Gleichklang blockieren, sowie ihre Mitgliedschaft k\u00FCndigen. Wenn Sie eine weitere Anschrift haben, ist es wichtig, dass Sie diese hinzuf\u00FCgen, weil dies den Kreis zu m\u00F6glichen Vorschl\u00E4ge ausdehnt.</p>
USERDATA_ABONNEMENT_DESCRIPTION=<p>Sie k\u00F6nnen hier Ihre derzeit gebuchte Teilnahme und deren G\u00FCltigkeitsdauer \u00E4ndern. Sie k\u00F6nnen ebenfalls die Bezahlart \u00E4ndern, Erweiterungen und Optimierungen buchen, Vermittlungskategorien abw\u00E4hlen oder hinzuf\u00FCgen, sowie die Unterbreitung von Vorschl\u00E4gen tempor\u00E4r aussetzen.</p>
USERDATA_STATISTICS_DESCRIPTION=<p>Diese Statistik zeigt Ihnen die Anzahl der insgesamt erhaltenen Vorschl\u00E4ge, der durch andere Mitglieder erhaltenen Nachrichten und der durch Sie an andere Mitglieder versandten Nachrichten.</p>

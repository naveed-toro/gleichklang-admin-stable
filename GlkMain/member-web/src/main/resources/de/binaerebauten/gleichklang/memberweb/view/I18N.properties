MEDIAGALLERY_HEADER_DESCRIPTION=Hier k\u00F6nnen Sie Fotos hochladen und diese in verschiedenen Galerien einstellen. F\u00FCr jede Galerie k\u00F6nnen Sie entscheiden, ob diese allen oder nur bestimmten Personen angezeigt werden soll. Wenn Sie keine Einschr\u00E4nkung vornehmen, wird die Galerie immer allen Personen angezeigt. Zum Erstellen einer neuen Galerie, klicken Sie einfach auf \u201Eneue Galerie\u201C.  Jetzt k\u00F6nnen Sie eine neue Galerie erstellen und danach Fotos in diese Galerie hochladen. Zum Hochladen von Fotos in eine Galerie, klicken Sie auf die Galerie. Sie k\u00F6nnen auch sp\u00E4ter jederzeit neue Fotos in eine Galerie hochladen, indem Sie auf die Galerie klicken. Ebenfalls kann eine Galerie gel\u00F6scht werden durch Klicken auf den Papierkorb. Eine Galerie kann bearbeitet werden, indem Sie auf den Stift klicken. 
#AUDIOGALLERY_HEADER_DESCRIPTION=Hier können Sie Audio hochladen und an Kategorien anhängen. Für jedes Audio können Sie entscheiden, ob es allen oder nur bestimmten Personen angezeigt werden soll. Wenn Sie keine Einschränkungen vornehmen, wird der Ton immer allen Personen angezeigt. Um ein neues Audio hochzuladen, klicken Sie einfach auf die Schaltfläche \ u201C + unter \ u201C. Außerdem können Sie ein Audio löschen, indem Sie auf die Schaltfläche "Löschen" klicken. Eine Kategorie für Audio kann durch Klicken auf die Schaltfläche Bearbeiten bearbeitet werden.
AUDIOGALLERY_HEADER_DESCRIPTION= Sie haben die Möglichkeit, etwas über sich selbst mit der eigenen Stimme zu erzählen. Denn die Stimme kann ein wichtiges Merkmal bei der Partner- und Freundschaftssuche sein. Hier können Sie eine Aufnahme Ihrer eigenen Stimme erzeugen oder hochladen und anschließend einer Vermittlungskategorie zuweisen. Um eine Audiodatei hochzuladen oder um eine neue Aufnahme zu erzeugen, klicken Sie einfach auf den Button "Audiogruß hinzufügen". Außerdem können Sie eine Aufnahme löschen, indem Sie auf die Schaltfläche "Löschen" klicken. Die Kategorie einer Aufnahme kann durch Klicken auf die Schaltfläche "Bearbeiten" bearbeitet werden.
AUDIOGALLERY_HEADER_RECORD_DESCRIPTION= Bitte vergewissern Sie sich, dass ein Mikrophon korrekt an Ihren Computer angeschlossen ist und dass Sie alle erforderlichen Berechtigungen für den Zugriff darauf erteilt haben. Eventuell müssen Sie global auf Betriebssystemebene und auf Browserebene die Erlaubnis für die Nutzung des Mikrophons erteilen.
AUDIOGALLERY_HEADER_UPLOAD_DESCRIPTION=Hier können Sie eine bereits vorhandene Aufnahme hochladen. Sie können eine Aufnahme zum Beispiel mit einer Audiorekorder-App auf Ihrem Smartphone erstellen. Die Aufnahme muss als WAV (mono & stereo, 16bit, uncompressed, 11.025 - 48 kHz) oder als MP3-Datei (mono & stereo, 44.1 kHz, cbr 8 - 320) vorliegen. Falls Ihre Datei nicht unterstützt wird, nutzen Sie bitte einen Audio-Konverter, wie beispielsweise <a href="{0}" target="_blank" style="color: white;">https://online-audio-converter.com/de/</a>.

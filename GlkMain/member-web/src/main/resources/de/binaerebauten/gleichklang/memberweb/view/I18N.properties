REGISTRATIONVIEW_CAPTION_CATEGORIES=Vermittlungsrubriken
REGISTRATIONVIEW_RULES_LABEL=AGB / Widerrufsbelehrung / Datenschutz / Community-Regeln
REGISTRATIONVIEW_RULES_DESCRIPTION=Ich erkl\u00E4re mich mit der Geltung der <a href="{0}" target="_blank">Allgemeinen Gesch\u00E4ftsbedingungen (AGB)</a> und den <a href="{1}" target="_blank">Datenschutzbestimmungen</a> einverstanden und erkenne die <a href="{0}" target="_blank">Widerrufsbelehrung</a> an. Ich werde ebenfalls die <a href="{2}" target="_blank">Regeln</a> f\u00FCr einen freundlichen und mitmenschlichen Umgang als Mitglied der Gleichklang-Community einhalten.<br>\
  <br>\
  Ich stimme der Speicherung und Verarbeitung meiner Daten f\u00FCr die Erbringung der von mir gew\u00FCnschten Dienstleistungen (Partnersuche und/oder Freundschaftssuche) zu. Ich bin auch einverstanden mit der Speicherung und Verarbeitung meiner besonders sensiblen Daten zur Sexualit\u00E4t, die f\u00FCr die Vermittlung von Partnerschaften erforderlich sind (z.B. Kenntnis der sexuellen Orientierung, um \u00FCberhaupt passende Vorschl\u00E4ge erbringen zu k\u00F6nnen). Wenn ich im Verlauf der Anmeldung f\u00FCr eine passende Vermittlung weitere besonders sensible Daten zu Sexualit\u00E4t, Gesundheit (z.B. Vorhandensein eines Handicaps) oder meinen gesellschaftlich-politischen Grundhaltungen angebe, bin ich ebenfalls mit deren Speicherung und Verarbeitung zum Zweck der Unterst\u00FCtzung meiner Partnersuche oder Freundschaftssuche einverstanden. Ich erkl\u00E4re mich mit den Datenschutzbestimmungen von Gleichklang einverstanden. Ich wei\u00DF, dass ich meiner Zustimmung zur Datenverarbeitung jederzeit widersprechen kann und ein Recht auf Korrektur und Vergessen (Datenl\u00F6schung) habe.

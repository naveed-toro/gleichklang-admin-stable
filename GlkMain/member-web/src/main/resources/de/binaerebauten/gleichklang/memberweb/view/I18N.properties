PRECONFIGNOTIFICATIONSVIEW_CAPTION_DESCRIPTION=Sie k\u00F6nnen hier einstellen, ob Sie Nachrichten von Gleichklang per Email erhalten wollen oder nicht. Wir raten Ihnen dringend, sich f\u00FCr den Erhalt von Emails zu entscheiden. Sonst merken Sie oft nicht schnell genug, wenn es neue Vorschl\u00E4ge, Gr\u00FC\u00DFe, Kontakte oder Neuerungen bei Gleichklang gibt. F\u00FCr die Effizienz Ihrer Nutzung von Gleichklang ist der Mailerhalt wichtig. Sie k\u00F6nnen Ihre Mailenstellungen sp\u00E4ter jederzeit wieder \u00E4ndern. Hier finden Sie unsere <a href="https://www.gleichklang.de/datenschutz/" target="_blank">Datenschutzerkl\u00E4rung</a>.
PRECONFIGNOTIFICATIONSVIEW_CAPTION_SUBTITLE=Benachrichtigungseinstellungen eingeben
PRECONFIGNOTIFICATIONSVIEW_CAPTION_SUBDESCRIPTION=Geben Sie hier ein, ob Sie von uns Benachrichtigungen erhalten wollen. Der Erhalt von Benachrichtigungen ist f\u00FCr die Nutzung von Gleichklang sehr sinnvoll und f\u00FChrt zu einem h\u00F6heren Vermittlungserfolg. Denn wer keine Benachrichtigungen erh\u00E4lt, \u00FCbersieht oft neue Ereignisse, m\u00F6gliche Kontakte oder auch wichtige Ver\u00E4nderungen und Tipps f\u00FCr eine effektive Partnersuche und Freundschaftssuche. Sie k\u00F6nnen sp\u00E4ter Ihre Einstellungen jederzeit wieder \u00E4ndern, ausstellen oder sogar noch differenzierter gestalten.
PRECONFIGNOTIFICATIONSVIEW_CAPTION_SYSTEMNOTIFICATION=Ich m\u00F6chte gerne, dass Gleichklang mir eine Email-Nachricht sendet, wenn es neue Vorschl\u00E4ge, Nachrichten, Gr\u00FC\u00DFe oder Interessant-Einstufungen f\u00FCr mich gibt (Zustimmung wird dringend empfohlen, da sonst die Effektivit\u00E4t der Vermittlung sinken kann.)
PRECONFIGNOTIFICATIONSVIEW_CAPTION_MARKETINGNOTIFICATION=Ich m\u00F6chte gerne, dass Gleichklang mir eine Email sendet, um mich \u00FCber Neuigkeiten, Verbesserungsm\u00F6glichkeiten meiner Suche, Aktionen, Umfragen etc. zu informieren (Zustimmung wird dringend empfohlen, da sonst die Effektivit\u00E4t der Vermittlung sinken kann.)

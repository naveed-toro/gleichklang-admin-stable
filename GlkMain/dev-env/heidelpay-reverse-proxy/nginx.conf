worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 768;
}

http {
  # the push notfication must be proxied to all servers because heidelpay can only register two urls
  upstream pushservers {
    server tomcat0.core.binaere-bauten.de:8080;
    server vkirilichev-macbook.core.binaere-bauten.de:8080;
  }

  upstream tomcat0.core.binaere-bauten.de {
    server tomcat0.core.binaere-bauten.de:8080;
  }

  upstream vkirilichev-macbook.core.binaere-bauten.de {
    server vkirilichev-macbook.core.binaere-bauten.de:8080;
  }

  server {
    error_log /var/log/nginx/reverse-proxy-warn.log warn;

    listen                   44443 ssl;
    server_name              heidelpay-reverse-proxy;

    ssl_certificate          /etc/nginx/server.crt;
    ssl_certificate_key      /etc/nginx/server.key;

    ssl_protocols TLSv1.2;

    location ~ ^/([^/]+)/(Gleichklang/api/heidelpay/push)$ {
      proxy_buffering off;

      proxy_pass             http://pushservers/$2;
      proxy_intercept_errors on;
      error_page             500 502 503 504  /50x.html;

      proxy_set_header       X-Real-IP $remote_addr;
      proxy_set_header       Host $host;
      proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # TODO: We have to return 200 otherwise Heidelpay will disable us again
    location = /50x.html {
        return 200;
    }

    location ~ ^/([^/]+)/(Gleichklang/api/heidelpay/response|Gleichklang/VAADIN/themes/gk_theme/.*)$ {
      proxy_buffering off;

      proxy_pass             http://$1/$2;

      proxy_set_header       X-Real-IP $remote_addr;
      proxy_set_header       Host $host;
      proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
